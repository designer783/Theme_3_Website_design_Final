Jeep Wrangler Rubicon"}],cy=[{question:`What is a ${O.name} and how does it differ from a standard history report?`,answer:`A ${O.name} is the vehicle's authentic factory production record—often called its birth certificate. It details the exact specifications, engine, transmission, optional packages, and original MSRP set when the car rolled off the assembly line. While a standard vehicle history report tells you what happened to the vehicle (accidents, title, mileage, service), the build sheet tells you what the vehicle actually is.`},{question:"How quickly will I receive my vehicle history report or window sticker?",answer:"Instantly. Once you enter the VIN and complete your request, the data is pulled directly from NMVTIS, state DMVs, insurance, and manufacturer databases. Your report is rendered immediately on screen, saved to your customer portal forever, and a secure download link is sent to your email."},{question:"Do your reports expire after 30 or 60 days like other providers?",answer:`No! Unlike other history providers that lock or expire your report after 30 days, every report and window sticker purchased on ${O.name} comes with lifetime access. It is saved in your account and can be viewed or downloaded as a PDF whenever you need it.`},{question:"What information do I need to look up a vehicle?",answer:"All you need is the vehicle's 17-character Vehicle Identification Number (VIN), which can be found on the driver's side dashboard, door jamb sticker, or vehicle registration. Alternatively, we also support lookups by US License Plate and State."},{question:"What is a Monroney Window Sticker?",answer:"Mandated by US federal law since 1958, the Monroney window sticker is the official label affixed to all new automobiles sold in the US. It lists the manufacturer's suggested retail price (MSRP), standard equipment, factory-installed optional packages, EPA fuel economy ratings, and crash test safety ratings."},{question:"Where do you source your vehicle data?
